<app-spinner [isLoading$$]="isLoading"></app-spinner>
<div class="drawer-fill participants-dialog">
    <div class="drawer-layout participants-dialog-content">
        <div class="drawer-body participants-dialog-content">
            <div class="attendies-list">
                @for(attendy of attendants(); track attendy){
                    <app-participant [attendy]="attendy"
                        [eventId]="data().eventId"
                        [style]="data().group?.style"
                        [eventDate]="data().eventDate"></app-participant>
                }
            </div>
        </div>
        <div class="actions">
            <button mat-button (click)="onClose()"> Закрыть</button>
        </div>
    </div>
</div>
