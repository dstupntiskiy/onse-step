<div class="coach-control">
    @if(substitution() || isEditing){
    <mat-form-field class="input substitution">
        <mat-label>Тренер (Замена)</mat-label>
        <mat-select [formControl]="substitutionControl">
            @for (option of coaches(); track option.id){
            <mat-option [value]="option.id">{{option.name}}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    }
    @else{
    <mat-form-field class="input coach">
        <mat-label>Тренер</mat-label>
        <mat-select [formControl]="coachControl">
            @for (option of coaches(); track option.id){
            <mat-option [value]="option.id">{{option.name}}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    }
    @if(coach()){
    @if(isEditing){
    <button mat-icon-button class="event-field-action" type="button" aria-label="Сохранить замену тренера" title="Сохранить замену тренера" [disabled]="!substitutionControl.value" (click)="onSubstitutionChange()">
        <mat-icon>done</mat-icon>
    </button>
    }
    @else{
    <button mat-icon-button class="event-field-action" type="button" [attr.aria-label]="substitution() ? 'Удалить замену тренера' : 'Заменить тренера'" [title]="substitution() ? 'Удалить замену тренера' : 'Заменить тренера'" (click)="substitution() ? onSubstitutionDelete() : onCoachEdit()">
        <mat-icon>{{ substitution() ? 'close' : 'loop'}}</mat-icon>
    </button>
    }
    }
</div>
