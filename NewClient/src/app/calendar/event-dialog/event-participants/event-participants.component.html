<div class="event-participants">
    <button mat-stroked-button type="button" [disabled]="isLoading()" [attr.aria-busy]="isLoading()" (click)="onClick()">
        <span class="button-content">
            <span [class.loading]="isLoading()">Группа: {{participantsCount()}} / {{groupParticipantsCount()}}</span>
            @if (isLoading()) {
                <mat-spinner [diameter]="18" aria-hidden="true"></mat-spinner>
            }
        </span>
    </button>
</div>
