<button class="record-card" (click)="handleClick()"><span class="record-top"><span class="record-avatar">{{(coach().name || '?').charAt(0)}}</span><span><strong>{{coach().name}}</strong><small>Тренер студии</small></span></span><span class="record-line"><span>Направление</span><b>{{coach().style?.name || 'Не указано'}}</b></span><span class="record-line"><span>Статус</span><b>{{coach().active ? 'В команде' : 'Неактивен'}}</b></span></button>
