<button class="record-card" (click)="onClick()"><span class="record-top"><span class="record-avatar">{{group().name.charAt(0)}}</span><span><strong>{{group().name}}</strong><small>{{group().style?.name}}</small></span><span class="status" [class.inactive]="!group().active">{{group().active ? 'Активна' : 'Архив'}}</span></span><span class="record-line"><span>Участники</span><b>{{group().membersCount}}</b></span><span class="record-line"><span>С абонементом</span><b [class.attention]="group().membersCount > group().membershipsCount">{{group().membershipsCount}} / {{group().membersCount}}</b></span></button>
