<div class="member-row" >
    <div class="member">
        <app-client-name [client]="member().member" (clientUpdate)="onClientChange()"></app-client-name>
        <div class="right-block">
            <app-membership-details 
                [membership]="member().membership"
                [client]="member().member"
                [style]="member().group.style"
                [date]="member().group.startDate"></app-membership-details>
            <button mat-icon-button class="remove-member" type="button" aria-label="Удалить участника"
                title="Удалить участника" (click)="removeMember(member())">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</div>
