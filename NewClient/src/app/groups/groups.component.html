<app-page header="Группы"><div class="directory-content"><div class="directory-toolbar"><button class="primary-button" (click)="handleAddGroupClick()">＋ Добавить группу</button><mat-slide-toggle [formControl]="onlyActive">Только активные</mat-slide-toggle></div><div class="directory-grid" appScrollNearEnd (nearEnd)="loadGroups()">@for(group of groups(); track group.id) { <app-group-card [group]="group"></app-group-card> } @empty { @if(!spinnerService.loading$$()) { <div class="directory-empty"><strong>Групп пока нет</strong>Добавьте группу, чтобы объединить клиентов и их абонементы.</div> } }</div></div></app-page>
