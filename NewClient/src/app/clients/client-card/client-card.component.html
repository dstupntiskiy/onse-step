<button class="record-card" (click)="clientClicked.emit(client())"><span class="record-top"><span class="record-avatar">{{client().name.charAt(0)}}</span><span><strong>{{client().name}}</strong><small>Клиент студии</small></span></span><span class="record-line"><span>Телефон</span><b>{{client().phone || 'Не указан'}}</b></span>@if(client().socialMediaLink) { <span class="record-line"><span>Соцсеть</span><b>{{client().socialMediaLink}}</b></span> }<span class="record-line"><span>С нами с</span><b>{{client().createDate | date:'dd.MM.yyyy'}}</b></span></button>
