<app-page><div class="directory-content"><div class="directory-toolbar"><button class="primary-button" (click)="handleAddClientClick()">＋ Добавить клиента</button><mat-form-field appearance="outline"><mat-label>Поиск по имени</mat-label><input matInput [formControl]="nameFilter">@if(nameFilter.value) { <button matSuffix mat-icon-button aria-label="Очистить поиск" (click)="nameFilter.setValue('')"><mat-icon>close</mat-icon></button> }</mat-form-field></div><div class="directory-grid" appScrollNearEnd (nearEnd)="loadOnScroll()">@for(client of clients; track client.id) { <app-client-card [client]="client" (clientClicked)="handleClientCardClick($event)"></app-client-card> } @empty { @if(!spinnerService.loading$$()) { <div class="directory-empty"><strong>Клиенты не найдены</strong>Измените поиск или добавьте первого клиента.</div> } }</div></div></app-page>
