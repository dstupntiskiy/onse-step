<section class="chart-panel"><h3>{{yLabel() || 'Сумма'}} <span>по {{xLabel() === 'Дата' ? 'датам' : 'направлениям'}}</span></h3>@if(chartData().length) { <div class="chart-rows" role="list">@for(item of chartData(); track $index) { <div class="chart-row" role="listitem"><div class="chart-label"><span>{{item.name}}</span><strong>{{item.value | number:'1.0-2'}}</strong></div><div class="bar-track" aria-hidden="true"><div class="bar" [style.width.%]="100 * item.value / maximum()"></div></div></div> }</div> } @else { <div class="chart-empty"><span>—</span><p>За этот период данных пока нет</p></div> }</section>
